<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inference-server · test page</title>
<style>
  :root {
    --bg: #101418; --panel: #1a2026; --border: #2a323b;
    --text: #e6edf3; --dim: #8b98a5; --accent: #4a9eff; --err: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100dvh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, sans-serif;
  }
  header {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 15px; margin: 0 4px 0 0; font-weight: 600; }
  #dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--err); flex: none;
  }
  #dot.ok { background: #3fb950; }
  select, input, textarea, button {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
  }
  select { max-width: 340px; }
  #api { width: 230px; color: var(--dim); }
  button { cursor: pointer; }
  button:hover { border-color: var(--dim); }
  #chat {
    flex: 1; overflow-y: auto; padding: 18px 14px;
    display: flex; flex-direction: column; gap: 14px;
  }
  #chat > .hint { color: var(--dim); text-align: center; margin: auto; }
  .msg { max-width: 780px; width: fit-content; }
  .msg .meta { font-size: 12px; color: var(--dim); margin-bottom: 3px; }
  .msg .body {
    padding: 9px 13px; border-radius: 12px; background: var(--panel);
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .msg.user { align-self: flex-end; }
  .msg.user .meta { text-align: right; }
  .msg.user .body { background: #1f3a5f; }
  .msg.error .body { border: 1px solid var(--err); }
  footer {
    display: flex; gap: 8px; padding: 10px 14px 14px;
    border-top: 1px solid var(--border);
  }
  #input { flex: 1; resize: none; }
  #send { width: 76px; flex: none; }
  #send.stop { border-color: var(--err); color: var(--err); }
</style>
</head>
<body>
<header>
  <h1>inference-server</h1>
  <span id="dot" title="API status"></span>
  <select id="model" title="model for the next message"></select>
  <button id="refresh" title="reload model list">&#10227;</button>
  <input id="api" spellcheck="false" title="Ollama API base URL">
  <button id="clear" title="forget the conversation">clear</button>
</header>

<main id="chat"><div class="hint">pick a model, type below — switching models
mid-chat keeps the history, so you can ask two models the same thing</div></main>

<footer>
  <textarea id="input" rows="2"
    placeholder="Message… (Enter to send, Shift+Enter for newline)"></textarea>
  <button id="send">Send</button>
</footer>

<script>
"use strict";
const $ = id => document.getElementById(id);
let history = [];        // [{role, content}] sent with every request
let controller = null;   // non-null while a response is streaming

// ---- API base -------------------------------------------------------------
const apiInput = $("api");
apiInput.value = localStorage.getItem("api") ||
  `http://${location.hostname || "localhost"}:11434`;
apiInput.addEventListener("change", () => {
  localStorage.setItem("api", apiInput.value.trim());
  loadModels();
});
const api = () => apiInput.value.trim().replace(/\/+$/, "");

// ---- model list -----------------------------------------------------------
async function loadModels() {
  const sel = $("model");
  try {
    const tags = await (await fetch(api() + "/api/tags")).json();
    let loaded = new Set();
    try {
      const ps = await (await fetch(api() + "/api/ps")).json();
      loaded = new Set((ps.models || []).map(m => m.name));
    } catch {}
    const models = (tags.models || [])
      .sort((a, b) => a.name.localeCompare(b.name));
    const prev = sel.value || localStorage.getItem("model");
    sel.innerHTML = "";
    for (const m of models) {
      const o = document.createElement("option");
      o.value = m.name;
      o.textContent = `${m.name} · ${(m.size / 1e9).toFixed(0)} GB` +
        (loaded.has(m.name) ? " · loaded" : "");
      sel.appendChild(o);
    }
    if (prev && models.some(m => m.name === prev)) sel.value = prev;
    $("dot").classList.toggle("ok", models.length > 0);
    if (!models.length) sel.innerHTML = "<option value=''>no models installed</option>";
  } catch {
    sel.innerHTML = "<option value=''>API unreachable</option>";
    $("dot").classList.remove("ok");
  }
}
$("model").addEventListener("change",
  () => localStorage.setItem("model", $("model").value));
$("refresh").addEventListener("click", loadModels);

// ---- chat rendering -------------------------------------------------------
function addMsg(role, label) {
  const hint = document.querySelector("#chat .hint");
  if (hint) hint.remove();
  const div = document.createElement("div");
  div.className = "msg " + role;
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = label;
  const body = document.createElement("div");
  body.className = "body";
  div.append(meta, body);
  $("chat").appendChild(div);
  return { div, meta, body };
}
const scrollDown = () => { $("chat").scrollTop = $("chat").scrollHeight; };

// ---- send / stream --------------------------------------------------------
async function send() {
  const text = $("input").value.trim();
  const model = $("model").value;
  if (!text || !model || controller) return;

  $("input").value = "";
  history.push({ role: "user", content: text });
  addMsg("user", "you").body.textContent = text;

  const m = addMsg("assistant", model);
  m.body.textContent = "…";
  scrollDown();

  controller = new AbortController();
  $("send").textContent = "Stop";
  $("send").classList.add("stop");
  let content = "";

  try {
    const r = await fetch(api() + "/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model, messages: history, stream: true }),
      signal: controller.signal,
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}: ${await r.text()}`);

    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const j = JSON.parse(line);
        if (j.error) throw new Error(j.error);
        if (j.message && j.message.content) {
          content += j.message.content;
          m.body.textContent = content;
        }
        if (j.done && j.eval_count && j.eval_duration) {
          const tps = j.eval_count / (j.eval_duration / 1e9);
          m.meta.textContent = `${model} · ${tps.toFixed(1)} tok/s`;
        }
      }
      scrollDown();
    }
  } catch (e) {
    if (e.name === "AbortError") {
      m.meta.textContent = model + " · stopped";
    } else {
      m.div.classList.add("error");
      m.meta.textContent = model + " · error";
      m.body.textContent = content || String(e.message || e);
    }
  } finally {
    if (content) history.push({ role: "assistant", content });
    controller = null;
    $("send").textContent = "Send";
    $("send").classList.remove("stop");
    loadModels();   // refresh "loaded" markers
  }
}

$("send").addEventListener("click",
  () => controller ? controller.abort() : send());
$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("clear").addEventListener("click", () => {
  history = [];
  $("chat").innerHTML =
    "<div class='hint'>conversation cleared — same model selection kept</div>";
});

loadModels();
</script>
</body>
</html>
